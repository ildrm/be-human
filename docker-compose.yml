name: be-human

services:
  postgres:
    image: postgres:17.6-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: be_human
      POSTGRES_USER: be_human
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-be_human_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U be_human -d be_human"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["storage"]

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    profiles: ["development"]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://be_human:${POSTGRES_PASSWORD:-be_human_dev}@postgres:5432/be_human
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    command: ["pnpm", "db:seed"]
    environment:
      DATABASE_URL: postgresql://be_human:${POSTGRES_PASSWORD:-be_human_dev}@postgres:5432/be_human
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://be_human:${POSTGRES_PASSWORD:-be_human_dev}@postgres:5432/be_human
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    command: ["pnpm", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://be_human:${POSTGRES_PASSWORD:-be_human_dev}@postgres:5432/be_human
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}/api/v1
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:3001/api/v1
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
