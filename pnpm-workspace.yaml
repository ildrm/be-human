packages:
  - apps/*
  - packages/*

# CI performs the online supply-chain verification once. Container builds then
# trust that reviewed, frozen lockfile so they remain deterministic and do not
# depend on hundreds of registry metadata requests.
trustLockfile: true

# Conservative registry settings keep clean container builds reliable on slow
# or rate-limited networks without changing the frozen dependency graph.
networkConcurrency: 4
fetchRetries: 5
fetchRetryFactor: 2
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 120000
fetchTimeout: 600000

overrides:
  '@fastify/middie': 9.3.4
  '@fastify/static': 10.1.4
  fastify: 5.12.5
  find-my-way: 9.9.0
  js-yaml: 4.3.2
  lodash: 4.18.1
  path-to-regexp: 8.4.0

allowBuilds:
  '@nestjs/core': false
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  unrs-resolver: true

onlyBuiltDependencies:
  - argon2
  - esbuild
  - sharp
